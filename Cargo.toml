[package]
name = "pansou-api"
version = "2.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
argon2 = "0.5"
async-stream = "0.3"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
dotenvy = "0.15"
futures = "0.3"
http = "1.3"
hmac = "0.12"
k256 = { version = "0.13", features = ["ecdsa"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
redis = { version = "0.32", features = ["aio", "tokio-comp", "connection-manager"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "brotli", "deflate"] }
scraper = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
