name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            name: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate release tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::发布必须选择 v 开头的标签，不能直接从分支发布。"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test release packaging
        if: runner.os != 'Windows'
        run: node --test .github/tests/release-workflow.test.mjs

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools (linux)
        if: endsWith(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        env:
          PACKAGE_OS: ${{ matrix.os }}
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          BIN="pansou-api"
          ARCHIVE_EXT="tar.gz"
          if [[ "$PACKAGE_OS" == windows* ]]; then BIN="pansou-api.exe"; ARCHIVE_EXT="zip"; fi
          mkdir -p pkg/frontend
          cp "target/$PACKAGE_TARGET/release/$BIN" "pkg/$BIN"
          cp -r frontend/dist "pkg/frontend/dist"
          # 包内只保留二进制、前端静态文件和默认 .env；部署辅助文件见 README。
          # .env 来自仓库模板，不含真实密钥；生产部署前请按需修改。
          cp .env.example "pkg/.env"
          OUT="pansou-${VERSION}-${PACKAGE_NAME}.${ARCHIVE_EXT}"
          if [[ "$ARCHIVE_EXT" == "zip" ]]; then
            # Windows runner 自带 7-Zip；传入目录 "."，不使用会遗漏 .env 的 shell 通配符。
            (cd pkg && 7z a -tzip "../$OUT" .)
            7z t "$OUT"
          else
            tar -czf "$OUT" -C pkg .
            gzip -t "$OUT"
            tar -tzf "$OUT" > /dev/null
          fi
          # macOS 不保证有 GNU sha256sum，使用系统 shasum 回退。
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum "$OUT" > "$OUT.sha256"
            sha256sum --check "$OUT.sha256"
          else
            shasum -a 256 "$OUT" > "$OUT.sha256"
            shasum -a 256 --check "$OUT.sha256"
          fi
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            ${{ env.OUT }}
            ${{ env.OUT }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Attach archives to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/pansou-*
          fail_on_unmatched_files: true
          generate_release_notes: true
