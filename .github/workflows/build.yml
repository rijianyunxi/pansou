name: build

on:
  push:
    branches: [rust, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "miniprogram/**"
  workflow_dispatch:

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Rust toolchain (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # 静态链接：产物不依赖宿主机 glibc，Debian 11 等旧系统可直接运行。
      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package binary with frontend dist
        run: |
          mkdir -p pkg/frontend
          cp target/x86_64-unknown-linux-musl/release/pansou-api pkg/
          cp -r frontend/dist pkg/frontend/dist
          cp deploy/pansou.service pkg/deploy/pansou.service
          tar -czf pansou-linux-amd64.tar.gz -C pkg pansou-api frontend deploy
          sha256sum pansou-linux-amd64.tar.gz > pansou-linux-amd64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: pansou-linux-amd64
          path: |
            pansou-linux-amd64.tar.gz
            pansou-linux-amd64.tar.gz.sha256
          retention-days: 14
