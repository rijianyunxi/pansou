<!doctype html>
<!-- 脱敏 fixture：公开频道预览页（含消息）。基于真实 t.me/s/ 页面结构手工精简，所有用户名/链接/文本均为虚构。 -->
<html>
  <head>
    <meta property="og:title" content="示例资源频道 – Telegram" />
    <title>示例资源频道 – Telegram</title>
  </head>
  <body>
    <div class="tgme_container">
      <div class="tgme_header_info">
        <div class="tgme_header_title">示例资源频道</div>
      </div>

      <!-- 消息 101：正常解析（夸克链接 + 提取码 + 正常日期） -->
      <div class="tgme_widget_message_wrap">
        <div class="tgme_widget_message" data-post="panhub_demo/101">
          <div class="tgme_widget_message_text" dir="auto">名称：三体 电视剧版 全季
夸克网盘：https://pan.quark.cn/s/8fH2kQrT
提取码：9x2k</div>
          <div class="tgme_widget_message_footer">
            <a class="tgme_widget_message_date" href="https://t.me/panhub_demo/101"><time datetime="2026-08-01T10:00:00+00:00"></time></a>
          </div>
        </div>
      </div>

      <!-- 消息 102：正常解析（百度盘链接，无密码） -->
      <div class="tgme_widget_message_wrap">
        <div class="tgme_widget_message" data-post="panhub_demo/102">
          <div class="tgme_widget_message_text" dir="auto">三体 广播剧 全集
链接：https://pan.baidu.com/s/1AbCdEfGhIjK?pwd=q3w5</div>
          <div class="tgme_widget_message_footer">
            <a class="tgme_widget_message_date" href="https://t.me/panhub_demo/102"><time datetime="2026-08-02T12:30:00+00:00"></time></a>
          </div>
        </div>
      </div>

      <!-- 消息 103：纯文本消息（无任何网盘链接，应被丢弃） -->
      <div class="tgme_widget_message_wrap">
        <div class="tgme_widget_message" data-post="panhub_demo/103">
          <div class="tgme_widget_message_text" dir="auto">三体 今天更新了制作花絮，敬请期待。</div>
          <div class="tgme_widget_message_footer">
            <a class="tgme_widget_message_date" href="https://t.me/panhub_demo/103"><time datetime="2026-08-03T08:00:00+00:00"></time></a>
          </div>
        </div>
      </div>

      <!-- 消息 104：异常日期 + 非公开/伪装链接（仅保留合法的阿里云盘链接，日期应置空） -->
      <div class="tgme_widget_message_wrap">
        <div class="tgme_widget_message" data-post="panhub_demo/104">
          <div class="tgme_widget_message_text" dir="auto">三体 动画版 合集
阿里云盘：https://www.alipan.com/s/vAlId00
假链接：https://evilalipan.com/s/fake
ftp://pan.quark.cn/s/nope
带凭证：https://user:pass@pan.quark.cn/s/leak</div>
          <div class="tgme_widget_message_footer">
            <a class="tgme_widget_message_date" href="https://t.me/panhub_demo/104"><time datetime="not-a-real-date"></time></a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
