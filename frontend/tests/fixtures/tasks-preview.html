<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>链接后台处理验收 · 模拟数据</title></head>
<body style="margin:0"><div id="app"></div>
<script type="module">
import { createApp, h } from 'vue';
import { createMemoryHistory, createRouter, RouterView } from 'vue-router';
import AdminLayout from '/components/admin/AdminLayout.vue';
import Tasks from '/pages/admin/tasks.vue';
import Accounts from '/pages/admin/cloud-accounts.vue';
import { providerForm } from '/lib/linkPolicy.ts';
import '/app.vue';
import '/assets/admin.css';
if(new URLSearchParams(location.search).get('theme')==='dark')document.documentElement.classList.add('dark');
const params=new URLSearchParams(location.search), scenario=params.get('scenario');
const now='2026-10-02T08:30:00Z';
const base={id:'101',createdAt:now,updatedAt:now,canRetry:false,canCancel:false};
const items={
 sync:[{...base,id:'resource-101',title:'示例资源 · 等待关联同步',kind:'link-sync',status:'queued',revision:4}],
 checks:[{...base,title:'示例分享 A · 已完成检测但结果待确认',provider:'aliyun',kind:'original',status:'completed',validity:-1,failureCount:2,attempts:2,errorCode:'check_failed',canRetry:true,runAfter:'2026-10-02T09:00:00Z',originalUrl:'https://www.alipan.com/s/example'}, {...base,id:'102',title:'示例分享 B',provider:'quark',kind:'original',status:'running',validity:1,attempts:1,leaseUntil:'2026-10-02T08:32:00Z'}, {...base,id:'103',title:'示例分享 C · 等待检测',provider:'xunlei',kind:'original',status:'queued',attempts:0,runAfter:'2026-10-02T09:10:00Z'}, {...base,id:'104',title:'示例分享 D · 失效分享',provider:'guangya',kind:'original',status:'failed',attempts:3,validity:0,errorCode:'original_invalid',canRetry:true}],
 resolve:[{...base,id:'resolve-101',title:'示例取链请求',kind:'resolve',provider:'xunlei',status:'completed',delivery:'original',reasonCode:'deadline_exceeded',deadlineAt:now}],
 maintenance:[{...base,title:'link-maintenance',kind:'link-maintenance',status:'completed',durationMs:24},{...base,id:'102',title:'link-sync',kind:'link-sync',status:'failed',durationMs:301,errorCode:'dependency_unavailable'}],
};
const cleanupBase={id:201,provider:'aliyun',originalUrl:'https://www.alipan.com/s/example',status:'blocked',stage:'verify',lastErrorCode:'cleanup_credentials_or_permissions',attempts:3,runAfter:now,cleanupAfter:now,updatedAt:now,artifactState:'uncertain',targetDir:'project-dir',ownedDirId:'owned-201',ownedDirPath:'/pansou/owned-201',directoryName:'取链超时的转存产物',writeStage:'transfer_intent',files:[{parent:'owned-201',file:{id:'file-201',name:'模拟文件.mp4'}}],shares:['share-201'],progress:null,canRetry:true,retryUnavailableReason:null};
const cleanupItems=[cleanupBase,{...cleanupBase,id:202,provider:'xunlei',status:'queued',artifactState:'expiring',lastErrorCode:null,directoryName:'等待到期的转存分享',canRetry:false,retryUnavailableReason:'not_due'}, {...cleanupBase,id:203,provider:'guangya',status:'completed',artifactState:'deleted',stage:'verify_deleted',lastErrorCode:null,directoryName:'已清理的晚到产物',canRetry:false,retryUnavailableReason:'completed'}];
const providers=['quark','baidu','aliyun','xunlei','guangya'];
const accounts=providers.map((provider,index)=>({provider,configured:index<2,status:index===0?'reauthorization_required':index===1?'unverified':'disconnected',bindingEpoch:1,tokenRevision:1,refreshable:false,qrSupported:true,officialUrl:'https://example.com',lastErrorCode:index===0?'reauthorization_required':undefined}));
const policies=providers.map(provider=>({...providerForm(),provider,enabled:provider==='quark',retentionSeconds:provider==='quark'?3600:null,targetDir:provider==='quark'?'project-dir':''}));
let reads=0;
const worker={state:scenario==='offline'?'offline':'online',count:scenario==='offline'?0:1,enabled:true,scheduleEnabled:true,syncEnabled:true,checkEnabled:true,maintenanceEnabled:true};
let checksEnabled=scenario!=='disabled';
// Fail closed. Never forward API requests, retries or deletions to real services.
window.fetch=async(input,options={})=>{
 const url=new URL(String(input),location.origin), path=url.pathname;
 if(path==='/api/account/session')return Response.json({authenticated:true,sessionId:'fixture-only',user:{id:1,username:'模拟管理员',role:'admin',status:'active'}});
 if(path==='/api/admin/cloud-accounts')return Response.json({data:{items:accounts}});
 if(path==='/api/settings/cloud-providers')return Response.json({data:{items:policies}});
 if(/^\/api\/admin\/cloud-accounts\/[a-z]+\/check$/.test(path)&&options.method==='POST'){
  const account=accounts.find(item=>item.provider===path.split('/').at(-2));
  if(!account)throw new Error('模拟账号不存在');
  await new Promise((resolve,reject)=>{
   const timer=setTimeout(resolve,2500);
   options.signal?.addEventListener('abort',()=>{clearTimeout(timer);reject(new DOMException('请求已取消','AbortError'));},{once:true});
  });
  if(scenario==='check-error'){
   account.status='reauthorization_required';account.lastErrorCode='reauthorization_required';
   return Response.json({message:'授权已失效，请重新连接。'},{status:401});
  }
  if(scenario==='check-network')throw new TypeError('Failed to fetch');
  if(scenario!=='check-unverified')Object.assign(account,{status:'ready',displayName:'模拟账号',subjectId:'fixture-account',lastVerifiedAt:new Date().toISOString(),lastErrorCode:undefined});
  return Response.json({data:{items:accounts}});
 }
 if(path==='/api/monitor')return Response.json({data:{workers:{links:{...worker}},links:{syncPending:0,queues:{cleanup:{queued:0}},checksEnabled,checkHealth:{readyAccounts:scenario==='unconfigured'?0:1}}}});
 if(path.startsWith('/api/admin/runtime/workers/')&&options.method==='PUT'){
  if(scenario==='control-error')return Response.json({message:'模拟调度保存失败'},{status:503});
  const body=typeof options.body==='string'?JSON.parse(options.body):options.body;
  if(body.activateChecks===true)checksEnabled=true;
  if(path.endsWith('/link-schedule'))worker.scheduleEnabled=body.enabled;
  else if(path.endsWith('/cleanup'))worker.enabled=body.enabled;
  else if(path.endsWith('/link-sync'))worker.syncEnabled=body.enabled;
  else if(path.endsWith('/link-check'))worker.checkEnabled=body.enabled;
  else if(path.endsWith('/link-maintenance'))worker.maintenanceEnabled=body.enabled;
  else throw new Error('模拟页不支持该开关');
  return Response.json({data:{checksEnabled,settings:{linkScheduleEnabled:worker.scheduleEnabled,linkEnabled:worker.enabled,linkSyncEnabled:worker.syncEnabled,linkCheckEnabled:worker.checkEnabled,linkMaintenanceEnabled:worker.maintenanceEnabled,crawlEnabled:true}}});
 }
 if(path==='/api/admin/link-cleanup'){
  let list=cleanupItems.filter(t=>!url.searchParams.get('provider')||t.provider===url.searchParams.get('provider'));
  const status=url.searchParams.get('status');
  if(status==='attention')list=list.filter(t=>['failed','blocked'].includes(t.status));
  else if(status&&status!=='all')list=list.filter(t=>t.status===status);
  return Response.json({data:{items:list,total:list.length,page:1,pageSize:30}});
 }
 if(path==='/api/admin/link-cleanup/201/retry'&&options.method==='POST'){cleanupItems[0].status='queued';cleanupItems[0].canRetry=false;return Response.json({data:{id:201,status:'queued'}});}
 if(path==='/api/admin/tasks/checks/101/retry'){
  items.checks[0].status='queued';return Response.json({data:{id:101,status:'queued'}});
 }
 const kind=path.split('/').pop();
 if(path.startsWith('/api/admin/tasks/')&&items[kind]){
  reads++;
  if(scenario==='error'&&reads>1)return Response.json({message:'模拟服务暂不可用'},{status:503});
  let list=(scenario==='empty'?[]:items[kind]).filter(t=>!url.searchParams.get('provider')||t.provider===url.searchParams.get('provider'));
  const status=url.searchParams.get('status');if(status&&status!=='all'&&status!=='attention')list=list.filter(t=>t.status===status);
  if(url.searchParams.has('before'))list=[{...base,id:'older-101',title:'上一批记录',kind:'original',provider:'quark',status:'completed',validity:0}];
  return Response.json({data:{items:list,workerState:kind==='resolve'?null:'online',enabled:kind==='checks'?checksEnabled:null,nextCursor:kind==='checks'&&!url.searchParams.has('before')?'fixture-cursor':null}});
 }
 throw new Error('验收页禁止真实网络请求：'+path);
};
const router=createRouter({history:createMemoryHistory(),routes:[{path:'/admin',component:AdminLayout,children:[{path:'cloud-accounts',component:Accounts},{path:'tasks',component:Tasks},{path:':pathMatch(.*)*',component:{render:()=>h('p','仅验收任务中心')}}]}]});
await router.push({path:params.get('page')==='accounts'?'/admin/cloud-accounts':'/admin/tasks',query:{kind:params.get('kind')||'checks'}});
createApp({render:()=>h(RouterView)}).use(router).mount('#app');
</script>
</body></html>
